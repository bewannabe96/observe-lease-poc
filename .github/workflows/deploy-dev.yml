name: deploy-dev
# 공용 dev 임대 규칙의 시험.
# - develop push: 랜딩. 언제나 배포한다(임대를 덮는다). 같은 tree 가 PR 에서 통과했으면 검사를 건너뛴다.
# - observe/** push: 임대. 지금 dev 에 다른 observe 브랜치가 서 있고 그 브랜치가 살아 있으면 거절한다. 검사 없이 배포만 한다.
# - observe/** 삭제(delete 이벤트): 반납. 지운 브랜치가 dev 에 서 있으면 develop 을 다시 배포한다.
# 임대 상태는 따로 두지 않는다. environment dev 의 가장 최근 성공 배포가 「지금 dev 에 선 것」이다.
on:
  push:
    branches: [develop, 'observe/**']
  delete:
concurrency:
  group: deploy-dev
  cancel-in-progress: false
permissions:
  contents: read
  deployments: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.p.outputs.action }}
      ref: ${{ steps.p.outputs.ref }}
      skip_tests: ${{ steps.p.outputs.skip_tests }}
      intent_met: ${{ steps.p.outputs.intent_met }}
    steps:
      - id: p
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ev = context.eventName;
            const norm = (r) => (r || '').replace(/^refs\/heads\//, '');
            // 회차는 대기 중에 취소될 수 있다(동시 실행 그룹은 대기 회차를 하나만 남긴다).
            // 그래서 사건만 처리하지 않고, 매번 「develop HEAD 가 dev 에 선 적이 있나」부터 맞춘다.
            const ds = [];
            for (const d of (await github.rest.repos.listDeployments({ owner, repo, environment: 'dev', per_page: 50 })).data) {
              const st = (await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 })).data[0];
              if (st && st.state === 'success') ds.push({ ref: norm(d.ref), sha: d.sha });
            }
            const cur = ds[0]?.ref ?? null;
            const developHead = (await github.rest.repos.getBranch({ owner, repo, branch: 'develop' })).data.commit.sha;
            const landed = ds.some((d) => d.sha === developHead);
            async function alive(b) { try { await github.rest.repos.getBranch({ owner, repo, branch: b }); return true; } catch { return false; } }
            const branch = ev === 'delete' ? context.payload.ref : norm(context.ref);
            core.notice(`event=${ev} branch=${branch} · 지금 dev=${cur} · develop HEAD ${developHead.slice(0, 7)} 선 적 ${landed}`);
            core.setOutput('action', 'none'); core.setOutput('skip_tests', 'true'); core.setOutput('intent_met', 'true');
            async function reuse(sha) {
              const want = (await github.rest.git.getCommit({ owner, repo, commit_sha: sha })).data.tree.sha;
              const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', event: 'pull_request', status: 'success', per_page: 30 })).data.workflow_runs;
              for (const r of runs) {
                const m = / · merge ([0-9a-f]{40})$/.exec(r.display_title || ''); if (!m) continue;
                try { if ((await github.rest.git.getCommit({ owner, repo, commit_sha: m[1] })).data.tree.sha === want) { core.notice(`tree ${want.slice(0, 7)} 는 PR 회차에서 통과했다. 검사를 건너뛴다`); return true; } } catch (e) {}
              }
              core.notice(`tree ${want.slice(0, 7)} 를 통과시킨 PR 회차가 없다. 검사를 돈다`); return false;
            }
            const wantsObserve = ev === 'push' && !context.payload.deleted && branch.startsWith('observe/');
            // 1. 밀린 랜딩이 있으면 무엇보다 먼저 세운다. 랜딩이 이긴다.
            if (!landed) {
              if (cur && cur.startsWith('observe/')) core.notice(`랜딩이 임대 ${cur} 를 덮는다`);
              if (wantsObserve) { core.warning(`밀린 랜딩을 먼저 세운다. ${branch} 는 이 회차에서 dev 를 잡지 못했다. 다시 push 한다`); core.setOutput('intent_met', 'false'); }
              core.setOutput('action', 'deploy'); core.setOutput('ref', developHead); core.setOutput('skip_tests', (await reuse(developHead)) ? 'true' : 'false'); return;
            }
            // 2. 반납: 지운 observe 브랜치가 dev 에 서 있으면 develop 을 다시 세운다.
            if (ev === 'delete') {
              if (context.payload.ref_type === 'branch' && branch.startsWith('observe/') && cur === branch) { core.notice(`반납: ${branch} → develop 재배포`); core.setOutput('action', 'deploy'); core.setOutput('ref', developHead); }
              return;
            }
            if (!wantsObserve) return;
            // 3. 임대
            if (cur && cur.startsWith('observe/') && cur !== branch && await alive(cur)) { core.setFailed(`임대 거절: dev 는 ${cur} 가 쥐고 있다`); return; }
            core.notice(`임대: ${branch} 가 dev 를 잡는다 (이전 ${cur})`);
            core.setOutput('action', 'deploy'); core.setOutput('ref', context.sha);
  test:
    needs: plan
    if: needs.plan.outputs.action == 'deploy' && needs.plan.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: sleep 20 && echo "전체 시험 통과 (가짜)"
  release:
    needs: [plan, test]
    if: always() && needs.plan.outputs.action == 'deploy' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - run: sleep 5 && echo "dev 에 섰다 (가짜) $(git rev-parse HEAD) $(cat app.txt)"
      - if: needs.plan.outputs.intent_met != 'true'
        run: echo "::error::이 회차는 밀린 랜딩을 세웠다. 요청한 임대는 잡지 못했다" && exit 1
