name: deploy-dev
# 공용 dev 임대 규칙의 시험.
# - develop push: 랜딩. 언제나 배포한다(임대를 덮는다). 같은 tree 가 PR 에서 통과했으면 검사를 건너뛴다.
# - observe/** push: 임대. 지금 dev 에 다른 observe 브랜치가 서 있고 그 브랜치가 살아 있으면 거절한다. 검사 없이 배포만 한다.
# - observe/** 삭제(delete 이벤트): 반납. 지운 브랜치가 dev 에 서 있으면 develop 을 다시 배포한다.
# 임대 상태는 따로 두지 않는다. environment dev 의 가장 최근 성공 배포가 「지금 dev 에 선 것」이다.
on:
  push:
    branches: [develop, 'observe/**']
  delete:
concurrency:
  group: deploy-dev
  cancel-in-progress: false
permissions:
  contents: read
  deployments: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.p.outputs.action }}
      ref: ${{ steps.p.outputs.ref }}
      skip_tests: ${{ steps.p.outputs.skip_tests }}
    steps:
      - id: p
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ev = context.eventName;
            const norm = (r) => (r || '').replace(/^refs\/heads\//, '');
            async function current() {
              const ds = (await github.rest.repos.listDeployments({ owner, repo, environment: 'dev', per_page: 30 })).data;
              for (const d of ds) {
                const st = (await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 })).data[0];
                if (st && st.state === 'success') return norm(d.ref);
              }
              return null;
            }
            async function alive(b) { try { await github.rest.repos.getBranch({ owner, repo, branch: b }); return true; } catch { return false; } }
            const cur = await current();
            core.notice(`event=${ev} ref=${context.ref} deleted=${!!context.payload.deleted} · 지금 dev=${cur}`);
            core.setOutput('action', 'none'); core.setOutput('skip_tests', 'true');
            if (ev === 'delete') {
              const del = context.payload.ref;
              if (context.payload.ref_type !== 'branch' || !del.startsWith('observe/')) return;
              if (cur !== del) { core.notice(`반납: ${del} 는 dev 에 서 있지 않다. 할 일 없음`); return; }
              core.notice(`반납: ${del} → develop 재배포`);
              core.setOutput('action', 'deploy'); core.setOutput('ref', 'develop'); return;
            }
            if (context.payload.deleted) { core.notice('삭제 push 다. 무시한다'); return; }
            const branch = norm(context.ref);
            if (branch === 'develop') {
              const want = (await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha })).data.tree.sha;
              const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', event: 'pull_request', status: 'success', per_page: 30 })).data.workflow_runs;
              let hit = false;
              for (const r of runs) {
                const m = / · merge ([0-9a-f]{40})$/.exec(r.display_title || ''); if (!m) continue;
                try { if ((await github.rest.git.getCommit({ owner, repo, commit_sha: m[1] })).data.tree.sha === want) { hit = true; core.notice(`tree ${want} 는 PR 회차 ${r.html_url} 에서 통과했다. 검사를 건너뛴다`); break; } } catch (e) {}
              }
              if (!hit) core.notice(`tree ${want} 를 통과시킨 PR 회차가 없다. 검사를 돈다`);
              if (cur && cur.startsWith('observe/')) core.notice(`랜딩이 임대 ${cur} 를 덮는다`);
              core.setOutput('action', 'deploy'); core.setOutput('ref', context.sha); core.setOutput('skip_tests', hit ? 'true' : 'false'); return;
            }
            if (cur && cur.startsWith('observe/') && cur !== branch && await alive(cur)) { core.setFailed(`임대 거절: dev 는 ${cur} 가 쥐고 있다`); return; }
            core.notice(`임대: ${branch} 가 dev 를 잡는다 (이전 ${cur})`);
            core.setOutput('action', 'deploy'); core.setOutput('ref', context.sha);
  test:
    needs: plan
    if: needs.plan.outputs.action == 'deploy' && needs.plan.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: sleep 20 && echo "전체 시험 통과 (가짜)"
  release:
    needs: [plan, test]
    if: always() && needs.plan.outputs.action == 'deploy' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - run: sleep 5 && echo "dev 에 섰다 (가짜) $(git rev-parse HEAD) $(cat app.txt)"
